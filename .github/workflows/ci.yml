# CI for the Ward Zero Godot project (docs/01-foundation.md §9).
name: ci

on:
  push:
    # Feature branches are covered by their pull request run.
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: gdformat
        run: gdformat --line-length 110 --check game tests tools
      - name: gdlint
        run: gdlint game tests tools
      - name: Localization lint
        run: python tools/loc_lint.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
      - name: Import project
        run: ~/godot/godot --headless --import
      - name: Unit tests
        run: ~/godot/godot --headless res://tests/run_tests.tscn

  export-web:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Cache Godot and web templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}
      - name: Install Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          curl -sSL -o t.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j t.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$T" && rm t.tpz
      - name: Import project
        run: ~/godot/godot --headless --import
      - name: Export web (release)
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release Web build/web/index.html
          test -f build/web/index.wasm
      - name: Size report
        run: python tools/size_report.py build/web --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

  web-smoke:
    # Boots the exported build in headless Chromium and checks the phone block message.
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Smoke test
        run: |
          python3 -m http.server -d build/web 8060 &
          sleep 1
          mkdir -p production/screens
          node tools/smoke/web_smoke.cjs http://localhost:8060/index.html production/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screens
          path: production/screens/web_*.png

  deploy:
    # Pushes to the itch.io restricted page. Needs BUTLER_API_KEY and ITCH_TARGET
    # (e.g. "user/ward-zero") secrets; skipped until they are set.
    runs-on: ubuntu-latest
    needs: [export-web, web-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/m'))
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          CHANNEL=web-dev
          case "$GITHUB_REF" in refs/tags/m*) CHANNEL=web-milestone ;; esac
          ./butler push web "$ITCH_TARGET:$CHANNEL" --userversion "${GITHUB_SHA::8}"
