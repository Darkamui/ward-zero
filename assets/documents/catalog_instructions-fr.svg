<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="5" y="5" width="890" height="1190" rx="5" fill="#E3DAC2" stroke="#A2977D" stroke-width="2"/><text x="70" y="80" font-family="monospace" font-size="23" fill="#646654" text-anchor="start">INSTITUT SAINTE-ODILE</text><path d="M70 105L830 105" stroke="#A69D80" stroke-width="2" fill="none"/><text x="70" y="160" font-family="monospace" font-size="28" fill="#292D2B" text-anchor="start">Classement des dossiers</text><text x="70" y="265" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Les fiches des patients sont classées par</text><text x="70" y="304" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">année, puis par mois de naissance.</text><text x="70" y="343" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Lors du déménagement, la fiche LAVOIE a été</text><text x="70" y="382" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">rangée avec les admissions de 1976. Cherchez-</text><text x="70" y="421" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">la à cet endroit, puis comparez la date de</text><text x="70" y="460" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">naissance complète avec le bracelet.</text><text x="70" y="1140" font-family="monospace" font-size="16" fill="#777761" text-anchor="start">CATALOG_INSTRUCTIONS</text></svg>