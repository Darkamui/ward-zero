<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="5" y="5" width="890" height="1190" rx="5" fill="#E3DAC2" stroke="#A2977D" stroke-width="2"/><text x="70" y="80" font-family="monospace" font-size="23" fill="#646654" text-anchor="start">INSTITUT SAINTE-ODILE</text><path d="M70 105L830 105" stroke="#A69D80" stroke-width="2" fill="none"/><text x="70" y="160" font-family="monospace" font-size="28" fill="#292D2B" text-anchor="start">Une enfant meurt dans un incendie</text><text x="70" y="265" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">NOUVELLES RÉGIONALES — 17 OCTOBRE 1976</text><text x="70" y="304" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Un incendie s’est déclaré hier soir au</text><text x="70" y="343" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">domicile de la famille Lavoie. Les services</text><text x="70" y="382" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">d’urgence ont été alertés à 21:40.</text><text x="70" y="421" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Claire Lavoie, six ans, a perdu la vie. Son</text><text x="70" y="460" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">frère aîné Mathieu a été secouru.</text><text x="70" y="499" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">La cause de l’incendie fait toujours l’objet</text><text x="70" y="538" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">d’une enquête.</text><text x="70" y="1140" font-family="monospace" font-size="16" fill="#777761" text-anchor="start">FIRE_CLIPPING</text></svg>