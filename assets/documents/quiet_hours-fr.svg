<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="5" y="5" width="890" height="1190" rx="5" fill="#E3DAC2" stroke="#A2977D" stroke-width="2"/><text x="70" y="80" font-family="monospace" font-size="23" fill="#646654" text-anchor="start">INSTITUT SAINTE-ODILE</text><path d="M70 105L830 105" stroke="#A69D80" stroke-width="2" fill="none"/><text x="70" y="160" font-family="monospace" font-size="28" fill="#292D2B" text-anchor="start">Heures de silence</text><text x="70" y="265" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">SALLE DE SÉJOUR</text><text x="70" y="304" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Le silence est demandé après la tournée du</text><text x="70" y="343" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">soir.</text><text x="70" y="382" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Pour le message du soir, réglez le récepteur</text><text x="70" y="421" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">sur 88.1 MHz.</text><text x="70" y="460" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Laissez la radio allumée.</text><text x="70" y="1140" font-family="monospace" font-size="16" fill="#777761" text-anchor="start">QUIET_HOURS</text></svg>