<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="5" y="5" width="890" height="1190" rx="5" fill="#E3DAC2" stroke="#A2977D" stroke-width="2"/><text x="70" y="80" font-family="monospace" font-size="23" fill="#646654" text-anchor="start">INSTITUT SAINTE-ODILE</text><path d="M70 105L830 105" stroke="#A69D80" stroke-width="2" fill="none"/><text x="70" y="160" font-family="monospace" font-size="28" fill="#292D2B" text-anchor="start">Note personnelle</text><text x="70" y="265" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">L’année de fondation figure sur la plaque du</text><text x="70" y="304" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">hall.</text><text x="70" y="343" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Placez ses deux derniers chiffres devant les</text><text x="70" y="382" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">deux premiers.</text><text x="70" y="421" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Avancez CHAQUE chiffre de 1, en revenant à 0</text><text x="70" y="460" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">après 9.</text><text x="70" y="499" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Les quatre chiffres obtenus ouvrent le coffre.</text><text x="70" y="538" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Saisissez-les de gauche à droite.</text><text x="70" y="1140" font-family="monospace" font-size="16" fill="#777761" text-anchor="start">SAFE_MEMO</text></svg>