<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="5" y="5" width="890" height="1190" rx="5" fill="#E3DAC2" stroke="#A2977D" stroke-width="2"/><text x="70" y="80" font-family="monospace" font-size="23" fill="#646654" text-anchor="start">INSTITUT SAINTE-ODILE</text><path d="M70 105L830 105" stroke="#A69D80" stroke-width="2" fill="none"/><text x="70" y="160" font-family="monospace" font-size="28" fill="#292D2B" text-anchor="start">Consignes de réception</text><text x="70" y="265" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Branchez le cordon de chaque service au poste</text><text x="70" y="304" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">indiqué dans l’annuaire.</text><text x="70" y="343" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">L’administration déverrouillera la grille</text><text x="70" y="382" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">intérieure lorsque les branchements seront</text><text x="70" y="421" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">corrects.</text><text x="70" y="460" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">Appuyez sur APPELER une fois les branchements</text><text x="70" y="499" font-family="monospace" font-size="25" fill="#292D2B" text-anchor="start">terminés.</text><text x="70" y="1140" font-family="monospace" font-size="16" fill="#777761" text-anchor="start">SWITCHBOARD_MEMO</text></svg>